services:
  # Transaction service infrastructure
  spanner-emulator:
    image: gcr.io/cloud-spanner-emulator/emulator
    container_name: spanner-transaction
    ports:
      - "9010:9010"
      - "9020:9020"
    restart: unless-stopped

  spanner-init:
    image: curlimages/curl:latest
    container_name: spanner-init
    depends_on:
      - spanner-emulator
    restart: "no"
    volumes:
      - ../transaction-service/scripts:/scripts
    entrypoint: ["/bin/sh", "/scripts/init-spanner.sh"]

  # Account service infrastructure
  postgres:
    image: postgres:15.1
    container_name: postgres-account
    cap_add:
      - SYS_NICE
    restart: always
    environment:
      - POSTGRES_DB=account
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=admin
    ports:
      - '15203:5432'
    command:
      - "postgres"
      - "-c"
      - "wal_level=logical"
      - "-c"
      - "max_replication_slots=4"
      - "-c"
      - "max_wal_senders=4"
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "postgres", "-d", "account" ]
      start_period: 2s
      interval: 2s
      timeout: 2s
      retries: 55
    volumes:
      - postgres:/data
  postgres-seed:
    image: postgres:15.1
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
     - ./init.sql:/init.sql:ro
    entrypoint: >
      sh -c "psql -h postgres -U postgres -d account -f /init.sql"
    environment:
      PGPASSWORD: admin
    restart: "no"

  # SHARED SERVICES
  # Kafka infrastructure
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT

      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1

    # Debezium
  debezium-connect:
    image: debezium/connect:2.6
    container_name: debezium-connect
    depends_on:
      - kafka
      - postgres
    ports:
      - "8083:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
      GROUP_ID: 1

      CONFIG_STORAGE_TOPIC: connect_configs
      OFFSET_STORAGE_TOPIC: connect_offsets
      STATUS_STORAGE_TOPIC: connect_status

      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER_SCHEMAS_ENABLE: "false"

      CONNECT_REST_ADVERTISED_HOST_NAME: debezium-connect
  
  # Observability services
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9095:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3030:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus
    volumes:
      - grafana-storage:/var/lib/grafana
  
  spanner-cdc-poller:
    build: ../transaction-poller
    container_name: spanner-poller
    depends_on:
      - kafka
      - spanner-emulator
      - spanner-init
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
      SPANNER_EMULATOR_HOST: spanner-emulator:9010
    restart: unless-stopped    
